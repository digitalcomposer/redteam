name: Vault quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Check links, fences, secrets, and shell pipelines
        run: ruby scripts/check-vault.rb
